<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Absensi Kegiatan HMTE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f1;--ink:#14202b;--muted:#566670;--line:#cfd8d3;--card:#fff;--accent:#0f5c6e;--on-accent:#fff;--signal:#e8a317;--err:#b3261e;--ok:#1d7a46;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f171d;--ink:#e6edf1;--muted:#93a4ae;--line:#2a3a44;--card:#172229;--accent:#4fb3c8;--on-accent:#06222a;--err:#ff8a80;--ok:#6fd49b}}
:root[data-theme="dark"]{--bg:#0f171d;--ink:#e6edf1;--muted:#93a4ae;--line:#2a3a44;--card:#172229;--accent:#4fb3c8;--on-accent:#06222a;--err:#ff8a80;--ok:#6fd49b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 18px 56px}
h1{font-size:clamp(2rem,8vw,2.8rem);line-height:1.02;margin:0 0 4px;font-weight:800;letter-spacing:-.02em}
.sub{margin:0;color:var(--muted)}
.wave{display:block;width:100%;height:36px;margin:14px 0 22px}
.wave path{fill:none;stroke:var(--signal);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
form,.done{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
label{display:block;font-weight:600;margin:0 0 14px}
label span{display:block;margin-bottom:5px;font-size:.95rem}
input[type=text],input[type=search],select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:9px;padding:11px 12px}
input:focus-visible,select:focus-visible,button:focus-visible,.shot:focus-within{outline:3px solid var(--signal);outline-offset:2px}
.shot{position:relative;display:grid;place-items:center;width:100%;aspect-ratio:1;max-height:320px;border:2px dashed var(--line);border-radius:12px;background:var(--bg);overflow:hidden;cursor:pointer;text-align:center;color:var(--muted);margin-bottom:16px}
.shot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot b{display:block;color:var(--ink)}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:13px 18px;cursor:pointer;background:var(--accent);color:var(--on-accent);width:100%}
button.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent);width:auto;padding:8px 14px}
button:disabled{opacity:.5;cursor:not-allowed}
.msg{min-height:1.4em;margin:12px 0 0;font-size:.95rem}
.msg.err{color:var(--err)}
.done{text-align:center}
.done h2{margin:0 0 6px;color:var(--ok)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.wave path{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.4s ease-out forwards}@keyframes draw{to{stroke-dashoffset:0}}}
</style>
</head>
<body>
<main>
  <h1>Absensi HMTE</h1>
  <p class="sub">Himpunan Mahasiswa Teknik Elektro. Isi data dan foto selfie untuk mencatat kehadiranmu.</p>
  <svg class="wave" viewBox="0 0 400 36" preserveAspectRatio="none" aria-hidden="true"><path d="M0 18 H70 L85 6 L105 30 L120 18 H200 L215 8 L235 28 L250 18 H400"/></svg>

    <form id="form" novalidate>
    <label><span>Nama kegiatan</span><input type="text" id="kegiatan" placeholder="Contoh: Rapat Kerja HMTE 2026" maxlength="100" autocomplete="off" required></label>
    <label><span>Nama mahasiswa</span><input type="text" id="nama" maxlength="80" autocomplete="name" required></label>
    <label><span>NIM</span><input type="text" id="nim" inputmode="numeric" maxlength="14" autocomplete="off" required></label>
    <div class="lbl" style="font-weight:600;margin-bottom:5px;font-size:.95rem">Foto selfie</div>
    <label class="shot" for="foto" style="margin-bottom:16px">
      <img id="prev" alt="Pratinjau selfie" hidden>
      <div id="hint"><b>Ketuk untuk membuka kamera</b>Pastikan wajahmu terlihat jelas</div>
      <input type="file" id="foto" accept="image/*" capture="user">
    </label>
    <button type="submit" id="send">Kirim absensi</button>
    <p id="msg" class="msg" role="status"></p>
  </form>

  <section id="done" class="done" hidden>
    <h2>Absensi tercatat</h2>
    <p id="doneTxt" class="sub"></p>
    <p><button type="button" id="again" class="ghost">Isi untuk orang lain</button></p>
  </section>

</main>

<script>
// Tempel URL web app Google Apps Script di sini (lihat README.md)
const SCRIPT_URL = 'GANTI_DENGAN_URL_WEB_APP';

const $ = s => document.querySelector(s);
let foto = null;
const qk = new URLSearchParams(location.search).get('kegiatan');
if (qk) $('#kegiatan').value = qk.slice(0, 100);

function say(t, err) { const m = $('#msg'); m.textContent = t; m.className = 'msg' + (err ? ' err' : ''); }

// Foto: potong persegi 400px, kompres JPEG agar muat di database
$('#foto').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const S = 400, c = document.createElement('canvas');
      c.width = c.height = S;
      const side = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, S, S);
      foto = c.toDataURL('image/jpeg', 0.65);
      $('#prev').src = foto; $('#prev').hidden = false; $('#hint').hidden = true;
    };
    img.onerror = () => say('File gambar tidak bisa dibaca. Coba foto lain.', true);
    img.src = r.result;
  };
  r.readAsDataURL(f);
});

$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const kegiatan = $('#kegiatan').value.trim(), nama = $('#nama').value.trim(), nim = $('#nim').value.trim();
  if (!kegiatan || !nama || !nim) return say('Lengkapi nama kegiatan, nama, dan NIM.', true);
  if (!/^\d{6,14}$/.test(nim)) return say('NIM hanya berisi angka (6–14 digit).', true);
  if (!foto) return say('Ambil foto selfie terlebih dahulu.', true);
  if (!SCRIPT_URL || SCRIPT_URL.startsWith('GANTI')) return say('SCRIPT_URL belum diisi di index.html.', true);
  $('#send').disabled = true; say('Mengirim…');
  try {
    const res = await fetch(SCRIPT_URL, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({kegiatan, nama, nim, foto})});
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || 'Server menolak data.');
    $('#doneTxt').textContent = nama + ' (' + nim + ') hadir di ' + kegiatan + '.';
    $('#form').hidden = true; $('#done').hidden = false;
  } catch (err) {
    say('Gagal mengirim: ' + (err.message || 'coba lagi.'), true);
  }
  $('#send').disabled = false;
});

$('#again').addEventListener('click', () => {
  $('#nama').value = ''; $('#nim').value = ''; foto = null; $('#foto').value = '';
  $('#prev').hidden = true; $('#hint').hidden = false; say('');
  $('#done').hidden = true; $('#form').hidden = false; $('#nama').focus();
});

</script>
</body>
</html>
